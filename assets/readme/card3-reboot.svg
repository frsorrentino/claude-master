<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a10"/><stop offset="1" stop-color="#160d08"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="92" fill="#ffffff" font-size="40" font-weight="800">After a reboot, everything comes back.</text>
  <text x="70" y="136" fill="#b9c7e8" font-size="24">Every session that was alive, each with its own conversation</text><rect x="70" y="210" width="470" height="310" rx="14" fill="#0b1020" stroke="#4a3320"/><text x="96" y="252" fill="#ffb27a" font-size="22" font-weight="700">before the reboot</text><circle cx="112" cy="286" r="8" fill="#3ddc84"/><text x="132" y="293" fill="#e8eefc" font-size="21" font-weight="500">claude-master</text><circle cx="112" cy="320" r="8" fill="#3ddc84"/><text x="132" y="327" fill="#e8eefc" font-size="21" font-weight="500">fable-director</text><circle cx="112" cy="354" r="8" fill="#3ddc84"/><text x="132" y="361" fill="#e8eefc" font-size="21" font-weight="500">site.com</text><circle cx="112" cy="388" r="8" fill="#3ddc84"/><text x="132" y="395" fill="#e8eefc" font-size="21" font-weight="500">client-a</text><circle cx="112" cy="422" r="8" fill="#3ddc84"/><text x="132" y="429" fill="#e8eefc" font-size="21" font-weight="500">client-b</text><circle cx="112" cy="456" r="8" fill="#3ddc84"/><text x="132" y="463" fill="#e8eefc" font-size="21" font-weight="500">client-c</text><line x1="560" y1="365" x2="640" y2="365" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><rect x="660" y="210" width="470" height="310" rx="14" fill="#0b1020" stroke="#4a3320"/><text x="686" y="252" fill="#ffb27a" font-size="22" font-weight="700">the first shell asks</text><text x="686" y="290" fill="#e8eefc" font-size="19" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">machine just restarted: 6 sessions</text><text x="686" y="316" fill="#e8eefc" font-size="19" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">registered before the reboot.</text><text x="686" y="342" fill="#e8eefc" font-size="19" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace">restore? [Y/n]</text><text x="686" y="382" fill="#3ddc84" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">ok: claude-master</text><text x="686" y="405" fill="#3ddc84" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">ok: fable-director</text><text x="686" y="428" fill="#3ddc84" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">ok: site.com</text><text x="686" y="451" fill="#3ddc84" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">ok: client-a</text><text x="686" y="474" fill="#3ddc84" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">ok: client-b</text><text x="686" y="497" fill="#3ddc84" font-size="18" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">ok: client-c</text><text x="70" y="590" fill="#9aa7c7" font-size="20" font-weight="500">each one restarts with --continue: the conversation is where you left it</text></svg>