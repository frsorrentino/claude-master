  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="100" fill="#ffffff" font-size="52" font-weight="800" text-anchor="start">One master runs all the others.</text><text x="70" y="146" fill="#b9c7e8" font-size="26" font-weight="500" text-anchor="start">Parallel sessions, one per project — terminal and wrist</text><rect x="70" y="200" width="360" height="330" rx="14" fill="#101733" stroke="#3b4d78"/><circle cx="108" cy="232" r="11" fill="#ff4d4d"/><text x="130" y="240" fill="#ffffff" font-size="26" font-weight="800" text-anchor="start">master</text><text x="96" y="272" fill="#9aa7c7" font-size="18" font-weight="500" text-anchor="start">the session of the root folder:</text><text x="96" y="296" fill="#9aa7c7" font-size="18" font-weight="500" text-anchor="start">launches, watches, answers,</text><text x="96" y="320" fill="#9aa7c7" font-size="18" font-weight="500" text-anchor="start">closes the rest</text><text x="96" y="372" fill="#9ad1ff" font-size="19" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ claude-master sessions</text><text x="96" y="400" fill="#9ad1ff" font-size="19" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ claude-master talk ledger-api "…"</text><text x="96" y="428" fill="#9ad1ff" font-size="19" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ claude-master answer ledger-api 1</text><text x="96" y="456" fill="#9ad1ff" font-size="19" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">$ claude-master restore</text><text x="96" y="500" fill="#9aa7c7" font-size="18" font-weight="500" text-anchor="start">your phone talks to it, too</text><rect x="500" y="218" width="260" height="64" rx="14" fill="#0b1020" stroke="#2f3f63"/><rect x="518" y="238" width="24" height="24" rx="3" fill="#3ddc84"/><text x="554" y="257" fill="#ffffff" font-size="22" font-weight="700" text-anchor="start">atlas-