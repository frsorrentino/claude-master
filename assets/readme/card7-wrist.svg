<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a2a"/><stop offset="1" stop-color="#08161a"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker>
  <clipPath id="round"><circle cx="0" cy="0" r="132"/></clipPath></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="100" fill="#ffffff" font-size="52" font-weight="800" text-anchor="start">From your wrist.</text><text x="70" y="146" fill="#b9c7e8" font-size="26" font-weight="500" text-anchor="start">Telegram, 22 characters wide: tap, dictate, be alerted</text><text x="70" y="220" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  «sessioni» → one button per session</text><text x="70" y="260" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  tap a name → its card: state, outcome, next</text><text x="70" y="300" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  a question → its options as buttons</text><text x="70" y="340" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  a number, «due si» or a tap answers it</text><text x="70" y="380" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  free text → a prompt, Invia / Annulla</text><text x="70" y="420" fill="#e8eefc" font-size="20" font-weight="500" text-anchor="start">•  silent, except questions and outcomes</text><text x="70" y="480" fill="#9ad1ff" font-size="18" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace" text-anchor="start">«sessioni», «lancia ledger-api», «segui», «riprendi»</text><text x="70" y="508" fill="#9aa7c7" font-size="17" font-weight="500" text-anchor="start">bare words, no slash: dictation-friendly</text><g transform="translate(600,190) scale(0.92) translate(-600,-190)"><circle cx="758.0" cy="348.0" r="158" fill="#2a2f3a"/><circle cx="758.0" cy="348.0" r="148" fill="#0f131c"/><rect x="912.0" y="326.0" width="12" height="44" rx="4" fill="#3a404d"/><circle cx="758.0" cy="348.0" r="132" fill="#05070c"/><g transform="translate(758.0,348.0)"><text x="0" y="-88" fill="#e8eefc" font-size="14" font-weight="800" text-anchor="middle">5 sessions · 1? · 1✗</text><rect x="-84" y="-70" width="168" height="24" rx="9" fill="#19233b" stroke="#324472"/><text x="-74" y="-49" fill="#ffd43b" font-size="15" font-weight="800" text-anchor="start">▶</text><circle cx="-48" cy="-55" r="6" fill="#ff4d4d"/><text x="-34" y="-49" fill="#e8eefc" font-size="15" font-weight="600" text-anchor="start">master</text><rect x="-84" y="-42" width="168" height="24" rx="9" fill="#19233b" stroke="#324472"/><text x="-74" y="-21" fill="#ffd43b" font-size="15" font-weight="800" text-anchor="start">▶</text><rect x="-54" y="-33" width="12" height="12" rx="3" fill="#3ddc84"/><text x="-34" y="-21" fill="#e8eefc" font-size="15" font-weight="600" text-anchor="start">atlas-shop</text><rect x="-84" y="-14" width="168" height="24" rx="9" fill="#19233b" stroke="#324472"/><text x="-74" y="7" fill="#3ddc84" font-size="15" font-weight="800" text-anchor="start">✓</text><circle cx="-48" cy="1" r="6" fill="#ff8c42"/><text x="-34" y="7" fill="#e8eefc" font-size="15" font-weight="600" text-anchor="start">field-notes</text><rect x="-84" y="14" width="168" height="24" rx="9" fill="#19233b" stroke="#324472"/><text x="-74" y="35" fill="#ff6b6b" font-size="15" font-weight="800" text-anchor="start">?</text><rect x="-54" y="23" width="12" height="12" rx="3" fill="#5aa7ff"/><text x="-34" y="35" fill="#e8eefc" font-size="15" font-weight="600" text-anchor="start">ledger-api</text><rect x="-84" y="42" width="168" height="24" rx="9" fill="#19233b" stroke="#324472"/><text x="-74" y="63" fill="#8a94b3" font-size="15" font-weight="800" text-anchor="start">✗</text><circle cx="-48" cy="57" r="6" fill="#a78bfa"/><text x="-34" y="63" fill="#e8eefc" font-size="15" font-weight="600" text-anchor="start">orbit-docs</text><rect x="-84" y="70" width="168" height="22" rx="9" fill="#19233b" stroke="#324472"/><text x="-74" y="91" fill="#e8eefc" font-size="15" font-weight="600" text-anchor="start">List</text></g><rect x="960" y="190" width="268.59999999999997" height="316" rx="63.2" fill="#2a2f3a"/><rect x="964" y="194" width="260.59999999999997" height="308" rx="59.2" fill="#0f131c"/><rect x="1226.6" y="259.52" width="12" height="50.56" rx="5" fill="#3a404d"/><rect x="1227.6" y="329.03999999999996" width="8" height="63.2" rx="3" fill="#3a404d"/><rect x="977.1739130434783" y="208.61995652173917" width="234.25217391304344" height="278.76008695652166" rx="46.85043478260869" fill="#05070c"/><g transform="translate(977.1739130434783,208.61995652173917)"><text x="117.12608695652172" y="24" fill="#9aa7c7" font-size="12" font-weight="500" text-anchor="middle">Claude Master</text><text x="16" y="50" fill="#e8eefc" font-size="14" font-weight="800" text-anchor="start">5 sessions · 1? · 1✗</text><text x="16" y="76" fill="#ffd43b" font-size="14" font-weight="800" text-anchor="start">▶</text><circle cx="40" cy="71" r="6" fill="#ff4d4d"/><text x="54" y="76" fill="#e8eefc" font-size="14" font-weight="600" text-anchor="start">master</text><text x="16" y="102" fill="#ffd43b" font-size="14" font-weight="800" text-anchor="start">▶</text><rect x="34" y="91" width="12" height="12" rx="3" fill="#3ddc84"/><text x="54" y="102" fill="#e8eefc" font-size="14" font-weight="600" text-anchor="start">atlas-shop</text><text x="16" y="128" fill="#3ddc84" font-size="14" font-weight="800" text-anchor="start">✓</text><circle cx="40" cy="123" r="6" fill="#ff8c42"/><text x="54" y="128" fill="#e8eefc" font-size="14" font-weight="600" text-anchor="start">field-notes</text><text x="16" y="154" fill="#ff6b6b" font-size="14" font-weight="800" text-anchor="start">?</text><rect x="34" y="143" width="12" height="12" rx="3" fill="#5aa7ff"/><text x="54" y="154" fill="#e8eefc" font-size="14" font-weight="600" text-anchor="start">ledger-api</text><text x="16" y="180" fill="#8a94b3" font-size="14" font-weight="800" text-anchor="start">✗</text><circle cx="40" cy="175" r="6" fill="#a78bfa"/><text x="54" y="180" fill="#e8eefc" font-size="14" font-weight="600" text-anchor="start">orbit-docs</text><text x="16" y="212" fill="#9ad1ff" font-size="13" font-weight="700" text-anchor="start">List</text></g><text x="758.0" y="530" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">Wear OS</text><text x="1094.3" y="530" fill="#9aa7c7" font-size="16" font-weight="500" text-anchor="middle">iOS · illustration</text></g><text x="70" y="592" fill="#9aa7c7" font-size="20" font-weight="500" text-anchor="start">Wear OS tested: keyboards render, taps arrive · watchOS: notifications and dictation, not verified</text></svg>