<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a2a"/><stop offset="1" stop-color="#08161a"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="92" fill="#ffffff" font-size="40" font-weight="800">Talk to any session, from anywhere.</text>
  <text x="70" y="136" fill="#b9c7e8" font-size="24">From another session or from your phone, on either account</text><rect x="80" y="220" width="150" height="270" rx="26" fill="#0b1a1a" stroke="#3ddc84" stroke-width="3"/><rect x="100" y="250" width="110" height="200" rx="8" fill="#12302e"/><text x="112" y="290" fill="#e8eefc" font-size="18" font-weight="500">is the</text><text x="112" y="316" fill="#e8eefc" font-size="18" font-weight="500">deploy</text><text x="112" y="342" fill="#e8eefc" font-size="18" font-weight="500">done?</text><text x="96" y="520" fill="#9aa7c7" font-size="20" font-weight="500">your phone</text><rect x="330" y="300" width="300" height="100" rx="14" fill="#1b3a3a" stroke="#3ddc84" stroke-width="2"/><text x="350" y="342" fill="#ffffff" font-size="24" font-weight="700">master</text><text x="350" y="374" fill="#b9e8d0" font-size="18" font-weight="500">root session, your phone's door</text><rect x="780" y="200" width="300" height="100" rx="14" fill="#1b3a3a" stroke="#3ddc84" stroke-width="2"/><text x="800" y="242" fill="#ffffff" font-size="24" font-weight="700">client-a</text><text x="800" y="274" fill="#b9e8d0" font-size="18" font-weight="500">work account</text><rect x="780" y="400" width="300" height="100" rx="14" fill="#1b3a3a" stroke="#3ddc84" stroke-width="2"/><text x="800" y="442" fill="#ffffff" font-size="24" font-weight="700">site.com</text><text x="800" y="474" fill="#b9e8d0" font-size="18" font-weight="500">personal account</text><line x1="234" y1="350" x2="322" y2="350" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><line x1="634" y1="330" x2="772" y2="260" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><line x1="634" y1="370" x2="772" y2="440" stroke="#3ddc84" stroke-width="3" marker-end="url(#m)"/><text x="70" y="555" fill="#9ad1ff" font-size="20" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,monospace">claude-master talk client-a "is the deploy done?"</text><text x="70" y="583" fill="#9aa7c7" font-size="18" font-weight="500">the answer is read from that session's own transcript</text><text x="70" y="610" fill="#9aa7c7" font-size="18" font-weight="500">nothing running? the Telegram bot answers /master and starts the root session for you</text></svg>