<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans',Helvetica,Arial,sans-serif" xml:space="preserve">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1033"/><stop offset="1" stop-color="#0c0818"/></linearGradient>
  <marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#3ddc84"/></marker></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="92" fill="#ffffff" font-size="40" font-weight="800">Evening diary, night shift.</text>
  <text x="70" y="136" fill="#b9c7e8" font-size="24">The day's summary on Telegram at 20:00; queued jobs run while you sleep</text><rect x="70" y="200" width="500" height="340" rx="14" fill="#0b1020" stroke="#4b3a7a"/><text x="96" y="240" fill="#c9b8ff" font-size="20" font-weight="700">Diary 10/09: 6 sessions, 41 turns, 3 waits</text><text x="96" y="282" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">client-a   09:12-18:40  14 turns  1 wait</text><text x="96" y="314" fill="#9aa7c7" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">  last: deploy done, cache purged</text><text x="96" y="346" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">site.com   10:02-alive   9 turns</text><text x="96" y="378" fill="#9aa7c7" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">  last: three files changed, tests green</text><text x="96" y="410" fill="#e8eefc" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">fable-dir  14:30-17:10   6 turns</text><text x="96" y="442" fill="#c9b8ff" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">Totals: personale 4/28, professionale 2/13</text><rect x="630" y="200" width="500" height="340" rx="14" fill="#0b1020" stroke="#4b3a7a"/><text x="656" y="240" fill="#c9b8ff" font-size="20" font-weight="700">02:00: night shift</text><text x="656" y="282" fill="#9ad1ff" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">$ claude-master night add ~/w/client-a \</text><text x="656" y="308" fill="#9ad1ff" font-size="17" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">    "update the changelog, run the tests"</text><text x="656" y="356" fill="#e8eefc" font-size="19" font-weight="500">runs one job at a time, only while</text><text x="656" y="383" fill="#e8eefc" font-size="19" font-weight="500">free RAM and the account's quota allow;</text><text x="656" y="410" fill="#e8eefc" font-size="19" font-weight="500">a report in the project's docs/notte/,</text><text x="656" y="437" fill="#e8eefc" font-size="19" font-weight="500">the summary on Telegram in the morning</text><text x="656" y="490" fill="#3ddc84" font-size="16" font-weight="500" font-family="'DejaVu Sans Mono',Menlo,monospace">OK client-a (412 s): changelog updated, tests green</text><text x="70" y="590" fill="#9aa7c7" font-size="20" font-weight="500">what happened, not what it cost: costs stay where they are measured (fable-director)</text></svg>